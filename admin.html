<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-EZC/uvXCByFge+7FOg3moEoEDWFKw/B1K/m6cVI3n6I='; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <title>系统管理 · Cloud Score</title>
  <style>
    :root{color-scheme:light;--ink:#18332f;--muted:#687a77;--paper:#f4f5ee;--surface:#fffef9;--line:#dce4df;--brand:#176b61;--brand-dark:#104b45;--brand-soft:#deefea;--amber:#bd7b25;--amber-soft:#fff0d7;--danger:#b3473d;--danger-soft:#fbe8e4;--blue:#365d83;--shadow:0 18px 50px rgba(24,51,47,.1);--radius:17px;--control-bg:#fff;--hover-bg:#f1f5f2;--panel-header-bg:#f4f7f4;--tag-bg:#eef3f0;--tag-color:#455e59;--code-bg:#eef2ef;--dialog-backdrop:rgba(15,33,30,.45)}
    :root[data-theme="dark"]{color-scheme:dark;--ink:#e3edea;--muted:#8ea5a0;--paper:#121b19;--surface:#182523;--line:#273e3a;--brand:#29a091;--brand-dark:#3ec4b3;--brand-soft:#1c3d37;--amber:#e59d38;--amber-soft:#382914;--danger:#e06053;--danger-soft:#381a17;--blue:#4a82b0;--shadow:0 18px 50px rgba(0,0,0,.5);--control-bg:#14201e;--hover-bg:#1e312d;--panel-header-bg:#1c2e2a;--tag-bg:#1e332e;--tag-color:#9abdb6;--code-bg:#162522;--dialog-backdrop:rgba(0,0,0,.7)}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#e3edea;--muted:#8ea5a0;--paper:#121b19;--surface:#182523;--line:#273e3a;--brand:#29a091;--brand-dark:#3ec4b3;--brand-soft:#1c3d37;--amber:#e59d38;--amber-soft:#382914;--danger:#e06053;--danger-soft:#381a17;--blue:#4a82b0;--shadow:0 18px 50px rgba(0,0,0,.5);--control-bg:#14201e;--hover-bg:#1e312d;--panel-header-bg:#1c2e2a;--tag-bg:#1e332e;--tag-color:#9abdb6;--code-bg:#162522;--dialog-backdrop:rgba(0,0,0,.7)}}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 5% -15%,var(--brand-soft) 0,transparent 34rem),var(--paper);color:var(--ink);transition:background .2s,color .2s}button,input,select{font:inherit}.hidden,[hidden]{display:none!important}button{cursor:pointer}
    .topbar{height:68px;padding:0 clamp(14px,3vw,34px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40;background:var(--surface);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.035em}.brand-mark{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:var(--brand);color:#fff}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.user{display:flex;align-items:center;gap:9px}.user-pill{padding:7px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:12px;font-weight:850}
    .btn{min-height:40px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:var(--control-bg);color:var(--ink);font-weight:800}.btn:hover{border-color:var(--brand);background:var(--hover-bg)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}.btn.ghost{background:transparent}.btn.ghost:hover{background:var(--hover-bg)}.btn.small{min-height:33px;padding:0 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.icon-btn{width:32px;min-height:32px;padding:0;display:grid;place-items:center}.main{max-width:1540px;margin:auto;padding:24px clamp(12px,2.5vw,34px) 50px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.page-head h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.045em;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.overview{display:flex;gap:10px}.metric{min-width:105px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 12px}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:750}.metric strong{font-size:19px}
    .notice{padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}.notice.error{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}.nav{display:flex;gap:5px;width:max-content;padding:5px;background:var(--paper);border-radius:13px;margin-bottom:16px}.nav button{border:0;background:transparent;color:var(--muted);font-weight:900;padding:10px 18px;border-radius:9px}.nav button.active{background:var(--surface);color:var(--brand-dark);box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-head{min-height:68px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:18px;letter-spacing:-.025em;margin:0 0 2px}.panel-head p{font-size:11px;color:var(--muted);margin:0}.head-actions{display:flex;align-items:center;gap:8px}.status-line{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status-dot{width:8px;height:8px;border-radius:50%;background:#869592}.status-dot.busy{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}.status-dot.ready{background:var(--brand)}.status-dot.error{background:var(--danger)}
    .teacher-list{display:grid}.teacher-row{display:grid;grid-template-columns:minmax(150px,1fr) 100px minmax(210px,1.5fr) 150px auto;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}.teacher-row:last-child{border-bottom:0}.teacher-row.header{background:var(--panel-header-bg);color:var(--muted);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.06em;padding-block:9px}.teacher-name{font-weight:900}.subtle{display:block;color:var(--muted);font-size:10px;margin-top:3px}.badge{display:inline-flex;align-items:center;width:max-content;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.badge.active{background:var(--brand-soft);color:var(--brand-dark)}.badge.archived{background:var(--paper);color:var(--muted)}.class-tags{display:flex;flex-wrap:wrap;gap:5px}.tag{background:var(--tag-bg);color:var(--tag-color);border-radius:7px;padding:4px 6px;font-size:10px;font-weight:750}.tag.empty{color:var(--muted);background:transparent;padding-left:0}.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
    .class-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:15px}.class-sidebar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;align-self:start;position:sticky;top:92px}.class-sidebar-head{padding:14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.class-sidebar-head strong{font-size:15px}.class-list{padding:7px;display:grid;gap:4px;max-height:calc(100vh - 210px);overflow:auto}.class-item{border:0;background:transparent;text-align:left;padding:11px;border-radius:11px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:9px}.class-item:hover{background:var(--hover-bg)}.class-item.active{background:var(--brand-soft);color:var(--brand-dark)}.class-item.archived{opacity:.66}.class-item strong{font-size:13px}.class-item small{display:block;color:var(--muted);margin-top:2px}.restore-inline{border:1px solid var(--line);background:var(--control-bg);border-radius:8px;min-height:30px;font-size:10px;font-weight:850;color:var(--brand-dark)}
    .class-work{min-width:0}.class-placeholder{min-height:420px;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:30px}.class-placeholder strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.class-title{display:flex;align-items:center;gap:10px}.class-code{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);background:var(--code-bg);padding:4px 7px;border-radius:6px}.structure-tabs{display:flex;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line);overflow:auto}.structure-tabs button{white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:850}.structure-tabs button.active{background:var(--brand-soft);color:var(--brand-dark)}.entity-list{display:grid}.entity-row{display:grid;grid-template-columns:54px minmax(150px,1fr) minmax(120px,.7fr) 90px auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.entity-row:last-child{border-bottom:0}.entity-row.archived{background:var(--paper);color:var(--muted)}.order-buttons{display:flex;gap:3px}.entity-name{font-weight:850}.entity-meta{font-size:11px;color:var(--muted)}.entity-row .row-actions{min-width:150px}.list-caption{padding:9px 16px;background:var(--panel-header-bg);color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--line)}
    dialog{border:0;padding:0;border-radius:20px;width:min(520px,calc(100vw - 28px));box-shadow:0 30px 90px rgba(0,0,0,.3);color:var(--ink);background:var(--surface)}dialog::backdrop{background:var(--dialog-backdrop)}.modal{padding:24px;background:var(--surface)}.modal h2{margin:0 0 6px;font-size:22px}.modal>p{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.6}.modal-fields{display:grid;gap:14px}.modal-field label,.field-label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.modal-field input,.modal-field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--control-bg);color:var(--ink)}.modal-field input:focus,.modal-field select:focus{outline:3px solid rgba(23,107,97,.16);border-color:var(--brand)}.check-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:190px;overflow:auto;padding:4px}.check-option{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:12px}.check-option input{width:17px;height:17px}.modal-error{margin-top:12px;padding:9px 11px;background:var(--danger-soft);color:var(--danger);border-radius:10px;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;z-index:90;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--brand-dark);color:#fff;padding:10px 14px;border-radius:11px;box-shadow:var(--shadow);font-size:12px;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){.teacher-row{grid-template-columns:minmax(130px,1fr) 90px 1.5fr auto}.teacher-row>div:nth-child(4){display:none}.class-layout{grid-template-columns:240px minmax(0,1fr)}.entity-row{grid-template-columns:48px minmax(130px,1fr) minmax(100px,.7fr) auto}.entity-row>div:nth-child(4){display:none}}
    @media(max-width:760px){.topbar{height:60px}.main{padding-top:17px}.page-head{display:block}.overview{margin-top:14px}.metric{flex:1}.nav{width:100%}.nav button{flex:1}.teacher-row.header{display:none}.teacher-row{grid-template-columns:1fr auto;padding:14px}.teacher-row>div:nth-child(3){grid-column:1/3}.teacher-row .row-actions{grid-column:1/3;justify-content:flex-start}.class-layout{display:block}.class-sidebar{position:static;margin-bottom:13px}.class-list{display:flex;overflow:auto;max-height:none}.class-item{min-width:170px}.entity-row{grid-template-columns:42px 1fr}.entity-row>div:nth-child(3){grid-column:2}.entity-row .row-actions{grid-column:2;justify-content:flex-start;min-width:0}.panel-head{align-items:flex-start}.head-actions{flex-wrap:wrap;justify-content:flex-end}.check-list{grid-template-columns:1fr}}
    @media(max-width:460px){.user-pill{display:none}.page-head p{display:none}.overview{gap:6px}.metric{min-width:0;padding:8px}.panel-head{display:block}.panel-head .head-actions{justify-content:flex-start;margin-top:10px}.entity-row{padding-inline:11px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">管</span><span>Cloud Score<small>System admin</small></span></div><div class="user"><span class="user-pill" id="userPill">admin</span><button class="btn ghost small icon-btn" id="themeBtn" title="切换浅色/深色主题" aria-label="切换浅色/深色主题" type="button"><span id="themeIcon">🌓</span></button><button class="btn ghost small" id="logoutButton" type="button">退出</button></div></header>
  <main class="main">
    <div class="page-head"><div><h1>系统管理</h1><p>维护教师权限与班级结构；归档操作可恢复，积分始终按稳定 ID 保留。</p></div><div class="overview"><div class="metric"><span>有效教师</span><strong id="teacherMetric">—</strong></div><div class="metric"><span>有效班级</span><strong id="classMetric">—</strong></div><div class="metric"><span>目录修订</span><strong id="revisionMetric">—</strong></div></div></div>
    <div class="notice hidden" id="notice" role="alert"></div>
    <nav class="nav" aria-label="管理区域"><button class="active" id="teacherNav" type="button">教师账号</button><button id="classNav" type="button">班级设置</button></nav>
    <section id="teacherView">
      <div class="panel"><div class="panel-head"><div><h2>教师账号</h2><p>一个教师可绑定多个班级，同一班级也可绑定多名教师。</p></div><div class="head-actions"><span class="status-line"><span class="status-dot" id="catalogDot"></span><span id="catalogStatus">正在加载…</span></span><button class="btn primary" id="addTeacher" type="button">新增教师</button></div></div><div class="teacher-list" id="teacherList"></div></div>
    </section>
    <section id="classView" class="hidden">
      <div class="class-layout"><aside class="class-sidebar"><div class="class-sidebar-head"><strong>班级目录</strong><button class="btn primary small" id="addClass" type="button">新增</button></div><div class="class-list" id="classList"></div></aside><div class="class-work" id="classWork"><div class="class-placeholder"><div><strong>选择一个有效班级</strong><span>可管理学生、评分项目与小组。</span></div></div></div></div>
    </section>
  </main>
  <dialog id="formDialog"><form class="modal" id="modalForm" method="dialog"><h2 id="modalTitle"></h2><p id="modalDescription"></p><div class="modal-fields" id="modalFields"></div><div class="modal-error hidden" id="modalError" role="alert"></div><div class="modal-actions"><button class="btn" id="modalCancel" value="cancel" type="button">取消</button><button class="btn primary" id="modalSubmit" type="submit">保存</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const state = { session: null, catalog: null, catalogRevision: 0, catalogEtag: "", classId: "", classData: null, classRevision: 0, classEtag: "", view: "teachers", structureTab: "student", busy: false };
    const ui = { notice: $("notice"), teacherList: $("teacherList"), classList: $("classList"), classWork: $("classWork"), dialog: $("formDialog"), modalForm: $("modalForm"), modalTitle: $("modalTitle"), modalDescription: $("modalDescription"), modalFields: $("modalFields"), modalError: $("modalError"), modalSubmit: $("modalSubmit"), toast: $("toast") };
    let dialogSubmit = null;

    function element(tag, className, text) {
      const value = document.createElement(tag);
      if (className) value.className = className;
      if (text !== undefined) value.textContent = String(text);
      return value;
    }

    function button(label, className, action, title = "") {
      const value = element("button", className || "btn small", label);
      value.type = "button";
      if (title) value.title = title;
      value.addEventListener("click", action);
      return value;
    }

    function mutationId() {
      return crypto.randomUUID().replaceAll("-", "");
    }

    function formatTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "—" : new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(date);
    }

    function notify(message) {
      ui.toast.textContent = message;
      ui.toast.classList.add("show");
      window.clearTimeout(notify.timer);
      notify.timer = window.setTimeout(() => ui.toast.classList.remove("show"), 2600);
    }

    function showNotice(message, isError = false) {
      ui.notice.textContent = message;
      ui.notice.classList.toggle("error", isError);
      ui.notice.classList.remove("hidden");
    }

    function clearNotice() {
      ui.notice.textContent = "";
      ui.notice.classList.add("hidden");
    }

    function setBusy(busy, text = "") {
      state.busy = busy;
      const dot = $("catalogDot");
      dot.className = `status-dot ${busy ? "busy" : "ready"}`;
      $("catalogStatus").textContent = text || (busy ? "正在保存…" : "已同步");
      document.querySelectorAll("button").forEach((item) => { if (!item.closest("dialog")) item.disabled = busy; });
    }

    async function api(path, options = {}) {
      const headers = new Headers({ Accept: "application/json", ...(options.headers || {}) });
      if (options.body !== undefined) headers.set("Content-Type", "application/json");
      const response = await fetch(path, { method: options.method || "GET", headers, credentials: "same-origin", cache: "no-store", body: options.body === undefined ? undefined : JSON.stringify(options.body) });
      let body = null;
      try { body = await response.json(); } catch { body = null; }
      if (!response.ok || !body?.ok) {
        if (response.status === 401) location.replace("/login.html");
        const error = new Error(body?.error?.message || `请求失败（${response.status}）`);
        error.status = response.status;
        error.code = body?.error?.code || "REQUEST_FAILED";
        error.details = body?.error?.details || {};
        throw error;
      }
      return { body, etag: response.headers.get("ETag") || body.etag || "" };
    }

    function catalogClassName(id) {
      return state.catalog?.classes.find((item) => item.id === id)?.name || id;
    }

    function updateMetrics() {
      $("teacherMetric").textContent = String(state.catalog?.teachers.filter((item) => item.active).length || 0);
      $("classMetric").textContent = String(state.catalog?.classes.filter((item) => item.active).length || 0);
      $("revisionMetric").textContent = String(state.catalogRevision || 0);
    }

    function renderTeachers() {
      ui.teacherList.replaceChildren();
      const header = element("div", "teacher-row header");
      ["账号", "状态", "绑定班级", "最近更新", "操作"].forEach((label) => header.append(element("div", "", label)));
      ui.teacherList.append(header);
      const teachers = state.catalog?.teachers || [];
      if (!teachers.length) {
        const empty = element("div", "empty");
        empty.append(element("strong", "", "还没有教师账号"), document.createTextNode("点击“新增教师”建立第一个账号。"));
        ui.teacherList.append(empty);
        return;
      }
      const ordered = [...teachers].sort((a, b) => Number(b.active) - Number(a.active) || a.username.localeCompare(b.username));
      for (const teacher of ordered) {
        const row = element("div", "teacher-row");
        const identity = element("div");
        identity.append(element("span", "teacher-name", teacher.username), element("span", "subtle", `权限版本 ${teacher.authVersion}`));
        const status = element("div");
        status.append(element("span", `badge ${teacher.active ? "active" : "archived"}`, teacher.active ? "使用中" : "已归档"));
        const tags = element("div", "class-tags");
        if (teacher.classIds.length) teacher.classIds.forEach((id) => tags.append(element("span", "tag", catalogClassName(id))));
        else tags.append(element("span", "tag empty", "未绑定班级"));
        const updated = element("div", "entity-meta", formatTime(teacher.updatedAt));
        const actions = element("div", "row-actions");
        if (teacher.active) {
          actions.append(button("绑定班级", "btn small", () => openTeacherClasses(teacher)), button("改密码", "btn small", () => openPasswordReset(teacher)), button("归档", "btn small danger", () => archiveTeacher(teacher)));
        } else {
          actions.append(button("恢复", "btn small", () => patchCatalog({ type: "teacher.restore", username: teacher.username, expectedVersion: teacher.version }, "教师账号已恢复").catch(() => {})));
        }
        row.append(identity, status, tags, updated, actions);
        ui.teacherList.append(row);
      }
    }

    function renderClassList() {
      ui.classList.replaceChildren();
      const classes = [...(state.catalog?.classes || [])].sort((a, b) => Number(b.active) - Number(a.active) || a.name.localeCompare(b.name, "zh-CN"));
      if (!classes.length) ui.classList.append(element("div", "empty", "暂无班级"));
      for (const item of classes) {
        const row = element("div", `class-item ${item.active ? "" : "archived"} ${state.classId === item.id ? "active" : ""}`.trim());
        const label = element("div");
        label.append(element("strong", "", item.name), element("small", "", `${item.id}${item.active ? "" : " · 已归档"}`));
        row.append(label);
        if (item.active) {
          row.setAttribute("role", "button");
          row.tabIndex = 0;
          row.addEventListener("click", () => selectClass(item.id));
          row.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectClass(item.id); } });
        } else {
          row.append(button("恢复", "restore-inline", (event) => { event.stopPropagation(); patchCatalog({ type: "class.restore", classId: item.id, expectedVersion: item.version }, "班级已恢复").catch(() => {}); }));
        }
        ui.classList.append(row);
      }
    }

    function activeEntities(kind) {
      const source = kind === "student" ? state.classData?.students : kind === "project" ? state.classData?.projects : state.classData?.groups;
      return [...(source || [])].filter((item) => item.active).sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));
    }

    function kindLabels(kind) {
      return kind === "student" ? ["学生", "学生姓名"] : kind === "project" ? ["评分项目", "项目名称"] : ["小组", "小组名称"];
    }

    function renderClassWork() {
      ui.classWork.replaceChildren();
      if (!state.classData) {
        const placeholder = element("div", "class-placeholder");
        const content = element("div");
        content.append(element("strong", "", "选择一个有效班级"), element("span", "", "可管理学生、评分项目与小组。"));
        placeholder.append(content);
        ui.classWork.append(placeholder);
        return;
      }
      const panel = element("section", "panel");
      const head = element("div", "panel-head");
      const titleBox = element("div");
      const title = element("div", "class-title");
      title.append(element("h2", "", state.classData.name), element("span", "class-code", state.classData.classId));
      titleBox.append(title, element("p", "", `班级修订 ${state.classRevision} · 结构修订 ${state.classData.structureRevision}`));
      const actions = element("div", "head-actions");
      actions.append(button("改名", "btn small", openRenameClass), button("刷新", "btn small", () => loadClass(state.classId)), button("归档班级", "btn small danger", archiveClass));
      head.append(titleBox, actions);
      const tabs = element("div", "structure-tabs");
      [["student", "学生"], ["project", "评分项目"], ["group", "小组"]].forEach(([kind, label]) => tabs.append(button(`${label} ${activeEntities(kind).length}`, state.structureTab === kind ? "active" : "", () => { state.structureTab = kind; renderClassWork(); })));
      panel.append(head, tabs, renderEntityList(state.structureTab));
      ui.classWork.append(panel);
    }

    function renderEntityList(kind) {
      const wrap = element("div", "entity-list");
      const [singular] = kindLabels(kind);
      const top = element("div", "panel-head");
      const copy = element("div");
      copy.append(element("h2", "", `${singular}管理`), element("p", "", kind === "student" ? "学生可属于零个或一个当前小组。" : kind === "project" ? "个人总分始终由当前有效项目动态汇总。" : "小组积分独立，不会计入学生个人总分。"));
      top.append(copy, button(`新增${singular}`, "btn primary small", () => openEntityForm(kind)));
      wrap.append(top);
      const active = activeEntities(kind);
      const all = kind === "student" ? state.classData.students : kind === "project" ? state.classData.projects : state.classData.groups;
      const archived = all.filter((item) => !item.active);
      wrap.append(element("div", "list-caption", `使用中 · ${active.length}`));
      if (!active.length) wrap.append(element("div", "empty", `暂无有效${singular}`));
      active.forEach((item, index) => wrap.append(renderEntityRow(kind, item, index, active)));
      if (archived.length) {
        wrap.append(element("div", "list-caption", `已归档 · ${archived.length}`));
        archived.forEach((item) => wrap.append(renderEntityRow(kind, item, -1, active)));
      }
      return wrap;
    }

    function renderEntityRow(kind, item, index, active) {
      const row = element("div", `entity-row${item.active ? "" : " archived"}`);
      const order = element("div", "order-buttons");
      if (item.active) {
        const up = button("↑", "btn icon-btn", () => reorderEntity(kind, index, -1), "上移");
        const down = button("↓", "btn icon-btn", () => reorderEntity(kind, index, 1), "下移");
        up.disabled = index === 0 || state.busy;
        down.disabled = index === active.length - 1 || state.busy;
        order.append(up, down);
      }
      const identity = element("div");
      identity.append(element("div", "entity-name", item.name), element("div", "entity-meta", `稳定 ID · ${item.id}`));
      const relation = element("div", "entity-meta");
      if (kind === "student") {
        const group = state.classData.groups.find((entry) => entry.id === item.groupId);
        relation.textContent = group ? `${group.active ? "小组" : "已归档小组"}：${group.name}` : "未分组";
      } else relation.textContent = item.active ? `显示顺序 ${index + 1}` : "历史数据保留";
      const version = element("div", "entity-meta", `版本 ${item.version}`);
      const actions = element("div", "row-actions");
      if (item.active) actions.append(button("编辑", "btn small", () => openEntityForm(kind, item)), button("归档", "btn small danger", () => archiveEntity(kind, item)));
      else actions.append(button("恢复", "btn small", () => patchStructure({ type: `${kind}.restore`, id: item.id, expectedVersion: item.version }, `${kindLabels(kind)[0]}已恢复`).catch(() => {})));
      row.append(order, identity, relation, version, actions);
      return row;
    }

    function renderAll() {
      updateMetrics();
      renderTeachers();
      renderClassList();
      renderClassWork();
    }

    async function loadCatalog() {
      setBusy(true, "正在读取目录…");
      try {
        const result = await api("/api/admin/catalog");
        state.catalog = result.body.data.catalog;
        state.catalogRevision = result.body.revision;
        state.catalogEtag = result.etag;
        clearNotice();
        renderAll();
      } catch (error) {
        showNotice(error.message, true);
      } finally { setBusy(false); }
    }

    async function loadClass(classId) {
      state.classId = classId;
      state.classData = null;
      renderClassList();
      renderClassWork();
      setBusy(true, "正在读取班级…");
      try {
        const result = await api(`/api/classes/${encodeURIComponent(classId)}`);
        state.classData = result.body.data.class;
        state.classRevision = result.body.revision;
        state.classEtag = result.etag;
        clearNotice();
      } catch (error) {
        showNotice(error.message, true);
      } finally { setBusy(false); renderAll(); }
    }

    function selectClass(classId) {
      if (state.busy) return;
      if (state.classId === classId && state.classData) return;
      loadClass(classId);
    }

    async function patchCatalog(operation, successMessage) {
      if (state.busy) return;
      setBusy(true, "正在保存目录…");
      clearNotice();
      try {
        const result = await api("/api/admin/catalog", { method: "PATCH", headers: { "If-Match": state.catalogEtag, "X-CSRF-Token": state.session.csrf }, body: { mutationId: mutationId(), baseRevision: state.catalogRevision, operations: [operation] } });
        state.catalog = result.body.data.catalog;
        state.catalogRevision = result.body.revision;
        state.catalogEtag = result.etag;
        notify(successMessage);
        if (state.classId && !state.catalog.classes.find((item) => item.id === state.classId && item.active)) { state.classId = ""; state.classData = null; }
      } catch (error) {
        if (error.status === 409 && error.details?.catalog) {
          state.catalog = error.details.catalog;
          state.catalogRevision = error.details.revision;
          state.catalogEtag = error.details.etag;
          showNotice("目录已被其他管理员更新，已载入最新版本，请再次确认操作。", true);
        } else showNotice(error.message, true);
        throw error;
      } finally { setBusy(false); renderAll(); }
    }

    async function patchStructure(operation, successMessage) {
      if (state.busy || !state.classData) return;
      setBusy(true, "正在保存班级结构…");
      clearNotice();
      try {
        const result = await api(`/api/classes/${encodeURIComponent(state.classId)}/structure`, { method: "PATCH", headers: { "If-Match": state.classEtag, "X-CSRF-Token": state.session.csrf }, body: { mutationId: mutationId(), baseRevision: state.classRevision, operations: [operation] } });
        state.classData = result.body.data.class;
        state.classRevision = result.body.revision;
        state.classEtag = result.etag;
        notify(successMessage);
      } catch (error) {
        if (error.status === 409 && error.details?.class) {
          state.classData = error.details.class;
          state.classRevision = error.details.revision;
          state.classEtag = error.details.etag;
          showNotice("班级结构已被其他管理员更新，已载入最新版本，请再次确认操作。", true);
        } else {
          showNotice(error.message, true);
          if (error.status === 409) await loadClass(state.classId);
        }
        throw error;
      } finally { setBusy(false); renderAll(); }
    }

    function addModalField(field) {
      const wrap = element("div", "modal-field");
      const label = element("label", "", field.label);
      label.htmlFor = `field-${field.key}`;
      wrap.append(label);
      if (field.type === "checks") {
        const choices = element("div", "check-list");
        choices.id = `field-${field.key}`;
        for (const option of field.options) {
          const choice = element("label", "check-option");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.name = field.key;
          input.value = option.value;
          input.checked = field.value.includes(option.value);
          choice.append(input, document.createTextNode(option.label));
          choices.append(choice);
        }
        wrap.append(choices);
      } else if (field.type === "select") {
        const input = document.createElement("select");
        input.id = `field-${field.key}`;
        input.name = field.key;
        for (const option of field.options) {
          const choice = document.createElement("option");
          choice.value = option.value;
          choice.textContent = option.label;
          choice.selected = option.value === field.value;
          input.append(choice);
        }
        wrap.append(input);
      } else {
        const input = document.createElement("input");
        input.id = `field-${field.key}`;
        input.name = field.key;
        input.type = field.type || "text";
        input.value = field.value || "";
        input.required = field.required !== false;
        if (field.minLength) input.minLength = field.minLength;
        if (field.maxLength) input.maxLength = field.maxLength;
        if (field.pattern) input.pattern = field.pattern;
        if (field.autocomplete) input.autocomplete = field.autocomplete;
        wrap.append(input);
      }
      ui.modalFields.append(wrap);
    }

    function openForm({ title, description, fields, submitLabel = "保存", onSubmit }) {
      ui.modalTitle.textContent = title;
      ui.modalDescription.textContent = description;
      ui.modalFields.replaceChildren();
      ui.modalError.textContent = "";
      ui.modalError.classList.add("hidden");
      fields.forEach(addModalField);
      ui.modalSubmit.textContent = submitLabel;
      ui.modalSubmit.disabled = false;
      dialogSubmit = onSubmit;
      ui.dialog.showModal();
      ui.modalFields.querySelector("input,select")?.focus();
    }

    function classCheckOptions() {
      return (state.catalog?.classes || []).filter((item) => item.active).map((item) => ({ value: item.id, label: `${item.name} · ${item.id}` }));
    }

    function openNewTeacher() {
      openForm({ title: "新增教师", description: "账号创建后可立即登录；账号不区分大小写，密码区分大小写。", fields: [
        { key: "username", label: "教师账号", maxLength: 32, pattern: "[A-Za-z0-9][A-Za-z0-9_-]{0,31}", autocomplete: "off" },
        { key: "password", label: "初始密码（6–128 个字符）", type: "password", minLength: 6, maxLength: 128, autocomplete: "new-password" },
        { key: "classIds", label: "绑定班级", type: "checks", value: [], options: classCheckOptions() },
      ], submitLabel: "创建账号", onSubmit: (values) => patchCatalog({ type: "teacher.create", username: values.username, password: values.password, classIds: values.classIds }, "教师账号已创建") });
    }

    function openTeacherClasses(teacher) {
      openForm({ title: `绑定班级 · ${teacher.username}`, description: "保存后该教师的旧会话会立即失效，需要重新登录。", fields: [{ key: "classIds", label: "可管理的班级", type: "checks", value: teacher.classIds, options: classCheckOptions() }], onSubmit: (values) => patchCatalog({ type: "teacher.setClasses", username: teacher.username, expectedVersion: teacher.version, classIds: values.classIds }, "班级绑定已更新") });
    }

    function openPasswordReset(teacher) {
      openForm({ title: `修改密码 · ${teacher.username}`, description: "修改后该教师的所有旧会话立即失效。", fields: [{ key: "password", label: "新密码（6–128 个字符）", type: "password", minLength: 6, maxLength: 128, autocomplete: "new-password" }], submitLabel: "修改密码", onSubmit: (values) => patchCatalog({ type: "teacher.resetPassword", username: teacher.username, expectedVersion: teacher.version, password: values.password }, "教师密码已修改") });
    }

    async function archiveTeacher(teacher) {
      if (!confirm(`归档教师账号 ${teacher.username}？其现有会话会立即失效，之后可恢复。`)) return;
      try { await patchCatalog({ type: "teacher.archive", username: teacher.username, expectedVersion: teacher.version }, "教师账号已归档"); } catch { /* Banner already explains failure. */ }
    }

    function openNewClass() {
      openForm({ title: "新增班级", description: "班级号创建后不可修改；允许字母、数字、短横线和下划线。", fields: [
        { key: "classId", label: "班级号", maxLength: 32, pattern: "[A-Za-z0-9][A-Za-z0-9_-]{0,31}", autocomplete: "off" },
        { key: "name", label: "班级显示名称", maxLength: 60, autocomplete: "off" },
      ], submitLabel: "创建班级", onSubmit: async (values) => { await patchCatalog({ type: "class.create", classId: values.classId, name: values.name }, "班级已创建"); const id = values.classId.normalize("NFKC").trim().toLowerCase(); switchView("classes"); await loadClass(id); } });
    }

    function openRenameClass() {
      const meta = state.catalog.classes.find((item) => item.id === state.classId);
      if (!meta) return;
      openForm({ title: "修改班级名称", description: `班级号 ${meta.id} 保持不变。`, fields: [{ key: "name", label: "显示名称", value: meta.name, maxLength: 60 }], onSubmit: async (values) => { await patchCatalog({ type: "class.rename", classId: meta.id, expectedVersion: meta.version, name: values.name }, "班级名称已更新"); await loadClass(meta.id); } });
    }

    async function archiveClass() {
      const meta = state.catalog.classes.find((item) => item.id === state.classId);
      if (!meta || !confirm(`归档班级“${meta.name}”？教师将无法访问，但学生、项目和积分会完整保留。`)) return;
      try { await patchCatalog({ type: "class.archive", classId: meta.id, expectedVersion: meta.version }, "班级已归档"); } catch { /* Banner already explains failure. */ }
    }

    function groupOptions(selected) {
      return [{ value: "", label: "不分组" }, ...activeEntities("group").map((item) => ({ value: item.id, label: item.name }))].map((item) => ({ ...item, selected: item.value === selected }));
    }

    function openEntityForm(kind, item = null) {
      const [singular, fieldLabel] = kindLabels(kind);
      const fields = [{ key: "name", label: fieldLabel, value: item?.name || "", maxLength: kind === "student" ? 50 : 40 }];
      if (kind === "student") fields.push({ key: "groupId", label: "所属小组", type: "select", value: item?.groupId || "", options: groupOptions(item?.groupId || "").map((entry) => ({ value: entry.value, label: entry.label })) });
      openForm({ title: `${item ? "编辑" : "新增"}${singular}`, description: item ? "名称、分组等属性会更新，历史积分仍绑定原稳定 ID。" : "创建后会追加到当前有效列表末尾。", fields, submitLabel: item ? "保存修改" : `新增${singular}`, onSubmit: (values) => {
        const operation = item ? { type: `${kind}.update`, id: item.id, expectedVersion: item.version, name: values.name } : { type: `${kind}.create`, name: values.name };
        if (kind === "student") operation.groupId = values.groupId || null;
        return patchStructure(operation, `${singular}${item ? "已更新" : "已新增"}`);
      } });
    }

    async function archiveEntity(kind, item) {
      const [singular] = kindLabels(kind);
      if (!confirm(`归档${singular}“${item.name}”？历史积分将保留并可恢复。`)) return;
      try { await patchStructure({ type: `${kind}.archive`, id: item.id, expectedVersion: item.version }, `${singular}已归档`); } catch { /* Banner already explains failure. */ }
    }

    async function reorderEntity(kind, index, direction) {
      const items = activeEntities(kind);
      const target = index + direction;
      if (target < 0 || target >= items.length) return;
      [items[index], items[target]] = [items[target], items[index]];
      try { await patchStructure({ type: `${kind}.reorder`, orderedIds: items.map((item) => item.id) }, "显示顺序已更新"); } catch { /* Banner already explains failure. */ }
    }

    function switchView(view) {
      state.view = view;
      const teachers = view === "teachers";
      $("teacherView").classList.toggle("hidden", !teachers);
      $("classView").classList.toggle("hidden", teachers);
      $("teacherNav").classList.toggle("active", teachers);
      $("classNav").classList.toggle("active", !teachers);
    }

    ui.modalForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!ui.modalForm.reportValidity() || !dialogSubmit) return;
      const data = new FormData(ui.modalForm);
      const values = {};
      ui.modalFields.querySelectorAll("[name]").forEach((input) => { values[input.name] = input.type === "checkbox" ? data.getAll(input.name) : String(data.get(input.name) || ""); });
      ui.modalSubmit.disabled = true;
      ui.modalError.classList.add("hidden");
      try { await dialogSubmit(values); ui.dialog.close(); }
      catch (error) { ui.modalError.textContent = error.message; ui.modalError.classList.remove("hidden"); }
      finally { ui.modalSubmit.disabled = false; }
    });
    $("modalCancel").addEventListener("click", () => ui.dialog.close());
    $("addTeacher").addEventListener("click", openNewTeacher);
    $("addClass").addEventListener("click", openNewClass);
    $("teacherNav").addEventListener("click", () => switchView("teachers"));
    $("classNav").addEventListener("click", () => switchView("classes"));
    $("logoutButton").addEventListener("click", async () => { try { await api("/api/auth/logout", { method: "POST", headers: { "X-CSRF-Token": state.session.csrf }, body: {} }); } finally { location.replace("/login.html"); } });

    const themeBtn = $("themeBtn");
    const themeIcon = $("themeIcon");
    function getSystemTheme() { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    function getStoredTheme() { return localStorage.getItem("cloud-score:theme") || "auto"; }
    function applyTheme(theme) {
      if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
      else document.documentElement.removeAttribute("data-theme");
      if (themeIcon) {
        themeIcon.textContent = theme === "dark" ? "🌙" : theme === "light" ? "☀️" : "🌓";
        const desc = theme === "auto" ? `跟随系统（${getSystemTheme() === "dark" ? "深色" : "浅色"}）` : (theme === "dark" ? "深色模式" : "浅色模式");
        themeBtn.title = `当前主题：${desc}（点击切换）`;
      }
    }
    function cycleTheme() {
      const current = getStoredTheme();
      const next = current === "auto" ? "dark" : current === "dark" ? "light" : "auto";
      if (next === "auto") localStorage.removeItem("cloud-score:theme");
      else localStorage.setItem("cloud-score:theme", next);
      applyTheme(next);
    }
    if (themeBtn) themeBtn.addEventListener("click", cycleTheme);
    applyTheme(getStoredTheme());
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (getStoredTheme() === "auto") applyTheme("auto");
    });

    async function initialize() {
      try {
        const session = await api("/api/auth/session");
        state.session = session.body.data;
        if (state.session.role !== "admin") return location.replace("/teacher.html");
        $("userPill").textContent = state.session.username;
        await loadCatalog();
      } catch (error) {
        showNotice(error.message, true);
      }
    }
    initialize();
  </script>
</body>
</html>
